# 거래비용 (검정과 백테스트가 같은 값을 쓴다)
costs:
  commission: 0.00015   # 매수·매도 각각
  sell_tax: 0.0020      # 매도 시 거래세+농특세. 현재 세율 확인 후 조정
  slippage: 0.0010      # 매수·매도 각각

# ① 원칙 검정
test:
  validate_start: "2023-01-01"   # 이전 = 검정 구간, 이후 = 검증 구간
  bootstrap_trials: 10000
  random_trials: 1000
  seed: 42
  # 통과 기준 (전부 충족해야 passed)
  min_events: 50
  alpha: 0.05                    # 검정 구간 p값
  alpha_validate: 0.10           # 검증 구간 p값
  random_percentile: 0.95        # 무작위 진입보다 상위 5%

# ② GPT 판단 루프
agent:
  model: "gpt-4o-mini"
  temperature: 0
  max_steps: 6
  prompt_version: "v1"

# ③ 가드레일 (주문 직전)
guardrails:
  max_order_weight: 0.05      # G06 1회 주문 ≤ 총자산의 5%  (원칙의 position_size와 맞춘다)
  max_position_weight: 0.10   # G07 한 종목 보유 비중 ≤ 10%
  min_cash_weight: 0.10       # G08 현금 비중 ≥ 10%
  max_orders_per_day: 10      # G09
  daily_loss_stop: -0.03      # G10 당일 -3%면 신규 매수 중단 (매도는 허용)
  stop_loss: -0.07            # F01 매수가 대비 -7%면 GPT 판단과 무관하게 매도

# ④ 주문
execution:
  initial_cash: 100000000     # 백테스트·모의투자 시작 자금 (원)
  live_capital: 1000000       # 실거래에서 Agent가 굴릴 수 있는 돈의 상한 (원). 계좌의 나머지 돈·종목은 건드리지 않는다
  live_fill_timeout: 60       # 시장가 주문 후 체결 확인 대기 (초)
  live_min_equity: 10000      # Agent 몫(현금+보유)이 이보다 작으면 판단하지 않는다 (원)
